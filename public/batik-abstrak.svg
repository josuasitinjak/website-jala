<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#ffffff" stroke-width="1.5">
    <!-- Wavy Parang / Mega Mendung Abstract Pattern -->
    <path d="M-50,50 Q 0,0 50,50 T 150,50 T 250,50" />
    <path d="M-50,60 Q 0,10 50,60 T 150,60 T 250,60" />
    <path d="M-50,70 Q 0,20 50,70 T 150,70 T 250,70" />
    <path d="M-50,80 Q 0,30 50,80 T 150,80 T 250,80" />
    
    <path d="M-50,150 Q 0,100 50,150 T 150,150 T 250,150" />
    <path d="M-50,160 Q 0,110 50,160 T 150,160 T 250,160" />
    <path d="M-50,170 Q 0,120 50,170 T 150,170 T 250,170" />
    <path d="M-50,180 Q 0,130 50,180 T 150,180 T 250,180" />

    <path d="M50,-50 Q 100,0 50,50" />
    <path d="M60,-50 Q 110,0 60,50" />
    <path d="M70,-50 Q 120,0 70,50" />
    <path d="M80,-50 Q 130,0 80,50" />

    <path d="M150,50 Q 100,100 150,150" />
    <path d="M160,50 Q 110,100 160,150" />
    <path d="M170,50 Q 120,100 170,150" />
    <path d="M180,50 Q 130,100 180,150" />

    <path d="M50,150 Q 100,200 50,250" />
    <path d="M60,150 Q 110,200 60,250" />
    <path d="M70,150 Q 120,200 70,250" />
    <path d="M80,150 Q 130,200 80,250" />
    
    <!-- Abstract Spots (Isen-isen) -->
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
    <circle cx="30" cy="25" r="1.5" fill="#ffffff" />
    <circle cx="25" cy="35" r="1.5" fill="#ffffff" />

    <circle cx="120" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="130" cy="125" r="1.5" fill="#ffffff" />
    <circle cx="125" cy="135" r="1.5" fill="#ffffff" />

    <circle cx="180" cy="20" r="1.5" fill="#ffffff" />
    <circle cx="190" cy="25" r="1.5" fill="#ffffff" />
    <circle cx="185" cy="35" r="1.5" fill="#ffffff" />
  </g>
</svg>
